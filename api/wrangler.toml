name = "sunnybridge-crm-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "50bcb6bbd4e10f2f1bea0adac4d3c617"

# workers.dev 子域名
workers_dev = true

[vars]
API_VERSION = "v1"
DEBUG = "true"
FEATURE_AUTO_DEDUCT = "true"
RESEND_API_KEY = "re_7ZfLM9p9_27LogrTCeuFi37jHdPDKhNEV"
# LLM 配置 (OpenAI 兼容)
# 使用 NVIDIA NIM 平台的视觉多模态大模型 (支持单图 OCR/目录结构解析/知识点提取，响应极速 ~3s)
LLM_BASE_URL = "https://integrate.api.nvidia.com/v1"
LLM_MODEL = "minimaxai/minimax-m3.1-flash"
# LLM_API_KEY 用 wrangler secret 配置 NVIDIA NIM API key

# D1 数据库配置
[[d1_databases]]
binding = "DB"
database_name = "sunnybridge-crm"
database_id = "e4457991-ecf6-47cf-a4f4-9ccf13a8b21d"

# R2 存储配置 (教材 PDF & 页面切图)
[[r2_buckets]]
binding = "TEXTBOOKS_R2"
bucket_name = "sunnybridge-textbooks"

# 定时调度 (Cron Triggers): 每 15 分钟扫描自动发布到期的阶段报告
[triggers]
crons = ["*/15 * * * *"]

