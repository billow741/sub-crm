[package]
name = "sunnybridge-companion"
version = "0.1.0"
description = "SunnyBridge Teacher Companion App"
authors = ["SunnyBridge Education"]
edition = "2021"

[lib]
name = "sunnybridge_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["full"] }
notify = "7.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
